name: mood_tracker_app
description: A simple Flutter app to track your daily mood, notes, and visualize stats.

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Mood Tracker dependencies
  pie_chart: ^5.4.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Optional – for Material 3 UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true